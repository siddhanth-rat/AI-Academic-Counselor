version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot-postgres
    restart: always
    environment:
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
      POSTGRES_DB: chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - chatbot_pgdata:/var/lib/postgresql/data

volumes:
  chatbot_pgdata:
